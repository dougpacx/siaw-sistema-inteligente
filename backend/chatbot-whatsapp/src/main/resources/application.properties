# Application Name and Server Port
spring.application.name=siaw-backend
server.port=8080

# Database Configuration
# Fallback default: H2 in-memory in PostgreSQL compatibility mode
# In production, set DB_URL (e.g. Supabase postgresql://...), DB_USER, DB_PASS
spring.datasource.url=${DB_URL:jdbc:h2:mem:siawdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# H2 Web Console (accessible at http://localhost:8080/h2-console during development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Google Gemini / Spring AI Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-1.5-flash}
